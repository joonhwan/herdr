name: Nightly Release

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Remove Zig Caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build Windows Binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          $package = Join-Path $env:RUNNER_TEMP "ConPTY.nupkg"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath herdr-windows-x86_64.zip

      - name: Generate Release Tag Name
        id: tag
        shell: pwsh
        run: |
          $tagName = "nightly-" + (Get-Date -Format "yyyy.MM.dd-HHmm")
          "tag_name=$tagName" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT

      - name: Create Dated Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Herdr Windows Nightly (${{ steps.tag.outputs.tag_name }})"
          body: |
            Automated Windows Nightly Build for Herdr.
            Built from branch `deploy` (commit ${{ github.sha }}).
          prerelease: true
          files: herdr-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Fixed Nightly Release for Scoop
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Herdr Windows Nightly (Latest)"
          body: |
            Latest Automated Windows Nightly Build for Herdr.
            Built from branch `deploy` (commit ${{ github.sha }}).
          prerelease: true
          files: herdr-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
