name: Nightly Release

on:
  push:
    branches:
      - deploy
    # The manifest commit this workflow pushes back to deploy must not
    # re-trigger the workflow.
    paths-ignore:
      - "bucket/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Remove Zig Caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build Windows Binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          $package = Join-Path $env:RUNNER_TEMP "ConPTY.nupkg"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath herdr-windows-x86_64.zip

      - name: Generate Release Tag Name
        id: tag
        shell: pwsh
        run: |
          $tagName = "nightly-" + (Get-Date -Format "yyyy.MM.dd-HHmm")
          "tag_name=$tagName" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT

      - name: Create Dated Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Herdr Windows Nightly (${{ steps.tag.outputs.tag_name }})"
          body: |
            Automated Windows Nightly Build for Herdr.
            Built from branch `deploy` (commit ${{ github.sha }}).
          prerelease: true
          files: herdr-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Convenience "always latest" download link. Scoop does not use this
      # rolling tag anymore; it pins the dated release above.
      - name: Update Rolling Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Herdr Windows Nightly (Latest)"
          body: |
            Latest Automated Windows Nightly Build for Herdr.
            Built from branch `deploy` (commit ${{ github.sha }}).
          prerelease: true
          files: herdr-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Artifact Hash
        id: hash
        shell: pwsh
        run: |
          $sha256 = (Get-FileHash herdr-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "sha256=$sha256" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT

      - name: Update Scoop Manifest
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
          ARTIFACT_SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          $ErrorActionPreference = "Stop"

          # Move onto whatever deploy looks like now: the build may have taken
          # long enough for another push to land. --force discards build-time
          # changes to tracked files; the artifact zip is untracked and stays.
          git fetch origin deploy
          git checkout --detach --force FETCH_HEAD

          $manifestPath = "bucket/herdr-nightly.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $env:TAG_NAME -replace '^nightly-', ''
          $arch = $manifest.architecture.'64bit'
          $arch.url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG_NAME/herdr-windows-x86_64.zip"
          $arch.hash = $env:ARTIFACT_SHA256
          ($manifest | ConvertTo-Json -Depth 10) + "`n" | Set-Content $manifestPath -Encoding utf8 -NoNewline

          if (-not (git status --porcelain -- $manifestPath)) {
            Write-Host "manifest already up to date"
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $manifestPath
          git commit -m "chore(scoop): publish $env:TAG_NAME"
          git push origin HEAD:deploy
