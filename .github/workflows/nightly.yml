name: Nightly Release

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: herdr-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.os != 'macos-latest'
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Build & Package (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Build & Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          $package = Join-Path $env:RUNNER_TEMP "ConPTY.nupkg"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath herdr-windows-x86_64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Tag Name
        id: tag
        run: |
          TAG_NAME="nightly-$(date +'%Y.%m.%d-%H%M')"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create Date-based Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Herdr Nightly Build (${{ steps.tag.outputs.tag_name }})"
          body: |
            Automated Nightly Build for Herdr.
            Built from branch `deploy` (commit ${{ github.sha }}).
          prerelease: true
          files: artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
